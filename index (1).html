<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portable TV AM FM</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
}

.tv{
  width:390px;
  max-width:95vw;
  background:#383838;
  border:4px solid #555;
  border-radius:28px;
  padding:18px;
  box-shadow:0 20px 50px #000;
}

/* CABECERA */

.logo{
  text-align:center;
  color:#ddd;
  font-size:18px;
  font-weight:bold;
  letter-spacing:4px;
  margin-bottom:14px;
}

/* PANTALLA */

.screen{
  width:100%;
  aspect-ratio:4/3;
  background:#000;
  border:7px solid #202020;
  border-radius:13px;
  overflow:hidden;
  position:relative;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.noSignal{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#777;
  font-family:monospace;
  font-size:18px;
}

/* RADIO */

.radioScreen{
  width:100%;
  aspect-ratio:4/3;
  background:#090909;
  border:7px solid #202020;
  border-radius:13px;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#ddd;
  font-family:monospace;
}

.radioBand{
  font-size:20px;
  color:#888;
}

.radioFrequency{
  font-size:42px;
  margin-top:8px;
}

.radioStatus{
  color:#777;
  margin-top:10px;
}

/* AUDIO */

audio{
  width:100%;
  margin-top:10px;
  display:none;
}

/* INFORMACIÓN */

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#151515;
  color:#ddd;
  margin-top:10px;
  padding:10px;
  border-radius:7px;
  font-family:monospace;
}

.channel{
  font-size:24px;
}

.station{
  max-width:60%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* BANDAS */

.bands{
  display:flex;
  gap:7px;
  margin-top:13px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 8px;
  background:#555;
  color:white;
  font-weight:bold;
}

button:active{
  transform:scale(.94);
}

.bandButton{
  flex:1;
}

.bandButton.active{
  background:#b62d2d;
}

/* CAMBIO */

.tuning{
  display:flex;
  gap:12px;
  margin-top:12px;
}

.tuning button{
  flex:1;
  font-size:28px;
}

/* CONFIGURACIÓN */

.settings{
  margin-top:15px;
}

.settingsTitle{
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

.inputRow{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.inputRow input{
  flex:1;
  min-width:0;
  padding:12px;
  border-radius:8px;
  border:1px solid #555;
  background:#151515;
  color:#fff;
  outline:none;
}

.inputRow button{
  width:80px;
}

/* ESTADO */

.status{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="tv">

  <div class="logo">
    PORTABLE TV
  </div>


  <!-- =====================
       PANTALLA TV
  ====================== -->

  <div
    class="screen"
    id="tvScreen">

    <video
      id="video"
      controls
      playsinline>
    </video>

    <div
      class="noSignal"
      id="noSignal">
      NO SIGNAL
    </div>

  </div>


  <!-- =====================
       PANTALLA RADIO
  ====================== -->

  <div
    class="radioScreen"
    id="radioScreen">

    <div
      class="radioBand"
      id="radioBand">
      FM
    </div>

    <div
      class="radioFrequency"
      id="radioFrequency">
      100.0 MHz
    </div>

    <div
      class="radioStatus"
      id="radioStatus">
      RADIO
    </div>

  </div>


  <!-- AUDIO -->

  <audio
    id="audio"
    controls>
  </audio>


  <!-- =====================
       INFORMACIÓN
  ====================== -->

  <div class="info">

    <div
      class="channel"
      id="channel">
      CH 1
    </div>

    <div
      class="station"
      id="station">
      SIN CANAL
    </div>

  </div>


  <!-- =====================
       BANDAS
  ====================== -->

  <div class="bands">

    <button
      class="bandButton active"
      id="tvButton"
      onclick="setBand('TV')">
      TV
    </button>

    <button
      class="bandButton"
      id="amButton"
      onclick="setBand('AM')">
      AM
    </button>

    <button
      class="bandButton"
      id="fmButton"
      onclick="setBand('FM')">
      FM
    </button>

  </div>


  <!-- =====================
       CAMBIO
  ====================== -->

  <div class="tuning">

    <button onclick="previous()">
      ◀
    </button>

    <button onclick="next()">
      ▶
    </button>

  </div>


  <!-- =====================
       CONFIGURACIÓN
  ====================== -->

  <div class="settings">

    <div class="settingsTitle">
      FUENTES
    </div>


    <!-- TV -->

    <div class="inputRow">

      <input
        id="tvURL"
        type="url"
        placeholder="URL lista M3U">

      <button
        onclick="loadTV()">
        TV
      </button>

    </div>


    <!-- AM -->

    <div class="inputRow">

      <input
        id="amURL"
        type="url"
        placeholder="URL AM .m3u8">

      <button
        onclick="saveAM()">
        AM
      </button>

    </div>


    <!-- FM -->

    <div class="inputRow">

      <input
        id="fmURL"
        type="url"
        placeholder="URL FM .m3u8">

      <button
        onclick="saveFM()">
        FM
      </button>

    </div>

  </div>


  <div
    class="status"
    id="status">
    Listo
  </div>

</div>


<script>

/* ==================================================
   VARIABLES
================================================== */

let currentBand = "TV";

let channels = [];

let currentChannel = 0;


/*
  Una sola URL para AM
*/

let amURL =
  localStorage.getItem("amURL") || "";


/*
  Una sola URL para FM
*/

let fmURL =
  localStorage.getItem("fmURL") || "";


/*
  Frecuencias visuales
*/

let amFrequency = 1000;

let fmFrequency = 100.0;


/* ==================================================
   ELEMENTOS
================================================== */

const video =
  document.getElementById("video");

const audio =
  document.getElementById("audio");

const tvScreen =
  document.getElementById("tvScreen");

const radioScreen =
  document.getElementById("radioScreen");

const noSignal =
  document.getElementById("noSignal");

const channel =
  document.getElementById("channel");

const station =
  document.getElementById("station");

const status =
  document.getElementById("status");

const radioBand =
  document.getElementById("radioBand");

const radioFrequency =
  document.getElementById("radioFrequency");

const radioStatus =
  document.getElementById("radioStatus");


/* ==================================================
   CARGAR URLS GUARDADAS
================================================== */

document.getElementById("amURL").value =
  amURL;

document.getElementById("fmURL").value =
  fmURL;


/* ==================================================
   CAMBIAR BANDA
================================================== */

function setBand(band){

  currentBand = band;


  document
    .querySelectorAll(".bandButton")
    .forEach(button =>
      button.classList.remove("active")
    );


  if(band === "TV"){

    document
      .getElementById("tvButton")
      .classList.add("active");

  }


  if(band === "AM"){

    document
      .getElementById("amButton")
      .classList.add("active");

  }


  if(band === "FM"){

    document
      .getElementById("fmButton")
      .classList.add("active");

  }


  /*
    Detener todo
  */

  video.pause();

  audio.pause();


  if(band === "TV"){

    tvScreen.style.display =
      "block";

    radioScreen.style.display =
      "none";

    audio.style.display =
      "none";

    playChannel();

  }


  if(band === "AM"){

    tvScreen.style.display =
      "none";

    radioScreen.style.display =
      "flex";

    audio.style.display =
      "block";

    playRadio("AM");

  }


  if(band === "FM"){

    tvScreen.style.display =
      "none";

    radioScreen.style.display =
      "flex";

    audio.style.display =
      "block";

    playRadio("FM");

  }

}


/* ==================================================
   TV
================================================== */

async function loadTV(){

  const url =
    document
      .getElementById("tvURL")
      .value
      .trim();


  if(!url){

    status.textContent =
      "Introduce una URL M3U";

    return;

  }


  status.textContent =
    "Cargando lista TV...";


  try{

    const response =
      await fetch(url);


    if(!response.ok)
      throw new Error(
        "HTTP " + response.status
      );


    const text =
      await response.text();


    parseM3U(text);


    localStorage.setItem(
      "tvURL",
      url
    );


  }catch(error){

    console.error(error);

    status.textContent =
      "No se pudo cargar la lista. Puede ser CORS.";

  }

}


/* ==================================================
   PARSER M3U
================================================== */

function parseM3U(text){

  channels = [];

  const lines =
    text.split(/\r?\n/);

  let name = null;


  for(const rawLine of lines){

    const line =
      rawLine.trim();


    if(!line)
      continue;


    /*
      Nombre del canal
    */

    if(line.startsWith("#EXTINF")){

      const comma =
        line.indexOf(",");


      if(comma !== -1){

        name =
          line
            .substring(comma + 1)
            .trim();

      }else{

        name = "Canal";

      }

      continue;

    }


    /*
      Ignorar comentarios
    */

    if(line.startsWith("#"))
      continue;


    /*
      URL del canal
    */

    if(
      line.startsWith("http://") ||
      line.startsWith("https://")
    ){

      channels.push({

        name:
          name ||
          "Canal " +
          (channels.length + 1),

        url:
          line

      });


      name = null;

    }

  }


  currentChannel = 0;


  status.textContent =
    channels.length +
    " canales TV cargados";


  setBand("TV");

}


/* ==================================================
   REPRODUCIR TV
================================================== */

function playChannel(){

  if(currentBand !== "TV")
    return;


  if(channels.length === 0){

    channel.textContent =
      "CH 1";

    station.textContent =
      "SIN CANAL";

    noSignal.style.display =
      "flex";

    return;

  }


  const current =
    channels[currentChannel];


  channel.textContent =
    "CH " +
    (currentChannel + 1);


  station.textContent =
    current.name;


  noSignal.style.display =
    "none";


  video.src =
    current.url;

  video.load();


  video.play().catch(() => {});

}


/* ==================================================
   RADIO
================================================== */

function playRadio(band){

  let url = "";


  if(band === "AM"){

    url = amURL;

    radioBand.textContent =
      "AM";

    radioFrequency.textContent =
      Math.round(amFrequency) +
      " kHz";

  }


  if(band === "FM"){

    url = fmURL;

    radioBand.textContent =
      "FM";

    radioFrequency.textContent =
      fmFrequency.toFixed(1) +
      " MHz";

  }


  if(!url){

    radioStatus.textContent =
      "SIN URL";

    audio.removeAttribute("src");

    return;

  }


  radioStatus.textContent =
    "REPRODUCIENDO";


  /*
    Una única URL por banda.
  */

  audio.src = url;

  audio.load();

  audio.play().catch(() => {});

}


/* ==================================================
   GUARDAR AM
================================================== */

function saveAM(){

  amURL =
    document
      .getElementById("amURL")
      .value
      .trim();


  localStorage.setItem(
    "amURL",
    amURL
  );


  status.textContent =
    "URL AM guardada";


  if(currentBand === "AM")
    playRadio("AM");

}


/* ==================================================
   GUARDAR FM
================================================== */

function saveFM(){

  fmURL =
    document
      .getElementById("fmURL")
      .value
      .trim();


  localStorage.setItem(
    "fmURL",
    fmURL
  );


  status.textContent =
    "URL FM guardada";


  if(currentBand === "FM")
    playRadio("FM");

}


/* ==================================================
   CAMBIAR ◀ ▶
================================================== */

function next(){

  if(currentBand === "TV"){

    if(channels.length === 0)
      return;


    currentChannel++;


    if(currentChannel >= channels.length)
      currentChannel = 0;


    playChannel();

  }


  /*
    AM/FM tienen una sola URL.
    Solo cambia la frecuencia mostrada.
  */

  if(currentBand === "FM"){

    fmFrequency += 0.1;


    if(fmFrequency > 108)
      fmFrequency = 87.5;


    radioFrequency.textContent =
      fmFrequency.toFixed(1) +
      " MHz";

  }


  if(currentBand === "AM"){

    amFrequency += 10;


    if(amFrequency > 1700)
      amFrequency = 530;


    radioFrequency.textContent =
      Math.round(amFrequency) +
      " kHz";

  }

}


function previous(){

  if(currentBand === "TV"){

    if(channels.length === 0)
      return;


    currentChannel--;


    if(currentChannel < 0)
      currentChannel =
        channels.length - 1;


    playChannel();

  }


  if(currentBand === "FM"){

    fmFrequency -= 0.1;


    if(fmFrequency < 87.5)
      fmFrequency = 108;


    radioFrequency.textContent =
      fmFrequency.toFixed(1) +
      " MHz";

  }


  if(currentBand === "AM"){

    amFrequency -= 10;


    if(amFrequency < 530)
      amFrequency = 1700;


    radioFrequency.textContent =
      Math.round(amFrequency) +
      " kHz";

  }

}


/* ==================================================
   TECLADO
================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "ArrowRight")
      next();

    if(event.key === "ArrowLeft")
      previous();

  }
);


/* ==================================================
   INICIO
================================================== */

setBand("TV");

</script>

</body>
</html>
